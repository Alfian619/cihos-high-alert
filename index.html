<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIHOS - Ciputra Hospital Surabaya</title><style>body{margin:0;background:#0a2f4a;padding:12px;font-family:Arial}.box{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;text-align:center}.btn{border:none;border-radius:25px;padding:14px;width:100%;margin-top:8px;color:#fff;font-weight:900}.blue{background:#2a7de1}.green{background:#1a9e5e}.red{background:#e23a3a}.lb{background:#fff;border:3px solid #d32f2f;border-radius:10px;padding:10px;margin-top:10px;text-align:left;font-size:11px;line-height:1.4}input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:4px;box-sizing:border-box}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-weight:800;font-size:11px;display:block;margin-top:8px;text-align:left}table{width:100%;border-collapse:collapse;margin-top:6px}th,td{border:1px solid #d32f2f;padding:4px;text-align:center;font-size:10px}th{background:#d32f2f;color:#fff}tr:nth-child(even){background:#ffeaea}.highlight{background:#fff176!important;font-weight:900}</style></head><body>
<div class="box"><img src="images.png" style="height:65px;max-width:90%"><br><b style="font-size:11px">OBAT HIGH ALERT | Ciputra Hospital Surabaya</b></div>
<div class="box" style="text-align:left"><b>👤 PASIEN</b><label>No RM</label><input id="rm" value="00123456"><label>Nama</label><input id="nm" value="John Doe"><div class="row"><div><label>BB (kg)</label><input id="bb" type="number" value="65"></div><div><label>Ruang</label><input id="rg" value="ICU Bed 04"></div></div></div>
<div class="box" style="text-align:left"><b>💊 OBAT</b><select id="ob"><option value="8">Norepinephrine 8 mg / 50 mL</option><option value="200">Dopamine 200 mg / 50 mL</option><option value="250">Dobutamine 250 mg / 50 mL</option><option value="4">Epinephrine 4 mg / 50 mL</option></select><div class="row"><div><label>Total Obat</label><input id="to" value="8 mg"></div><div><label>PZ/D5</label><select id="pe"><option>PZ (NaCl 0.9%)</option><option>D5</option></select></div></div><div class="row"><div><label>Vol</label><select id="vo"><option>50 mL Spuit</option><option>50 mL</option><option>100 mL</option></select></div><div><label>Target mcg/kg/min</label><input id="ta" type="number" value="0.05" step="0.01"></div></div><label>Giver</label><input id="gv" value="a"><label>Checker</label><input id="ck" value="b"></div>
<div class="box"><button class="btn blue" onclick="buat('titrasi')">Tabel Titrasi Obat</button><button class="btn green" onclick="buat('spuit')">💉 Label Spuit</button><button class="btn red" onclick="document.getElementById('area').innerHTML=''">🗑️ Hapus</button></div>
<div id="area"></div>
<script>
function buat(jenis){
var rm=document.getElementById('rm').value||'-';var nm=document.getElementById('nm').value||'-';var bb=parseFloat(document.getElementById('bb').value)||65;
var ob=parseFloat(document.getElementById('ob').value)||8;var to=document.getElementById('to').value||'8 mg';var pe=document.getElementById('pe').value||'PZ';
var vo=document.getElementById('vo').value||'50 mL Spuit';var ta=parseFloat(document.getElementById('ta').value)||0.05;var gv=document.getElementById('gv').value||'-';var ck=document.getElementById('ck').value||'-';
if(gv=='-'||ck=='-'){alert('Isi Giver & Checker!');return;}
var volNum=parseFloat(vo)||50;
var ug=(ob*1000)/volNum;
var mlTarget=((ta*bb*60)/ug).toFixed(2);
var now=new Date();var tgl=now.toLocaleString('id-ID');var exp=new Date(now.getTime()+86400000);var tglExp=exp.toLocaleString('id-ID');
var dosisList=[0.01,0.03,0.05,0.08,0.1,0.15,0.2,0.3,0.5];
if(ta>0.5){dosisList=[0.05,0.1,0.2,0.3,0.5,0.7,1.0];}
var tabel='<table><tr><th>Dosis<br>mcg/kg/min</th><th>Kecepatan<br>mL/jam</th></tr>';
for(var i=0;i<dosisList.length;i++){
 var d=dosisList[i];
 var ml=((d*bb*60)/ug).toFixed(2);
 var cls=(Math.abs(d-ta)<0.001)?' class="highlight"':'';
 tabel+='<tr'+cls+'><td>'+d.toFixed(2)+'</td><td><b>'+ml+'</b></td></tr>';
}
tabel+='</table>';
var rumus='<div style="background:#e3f2fd;padding:4px;border-radius:5px;margin-top:5px;font-size:9px">Rumus: (mcg/kg/min x BB x 60) / Konsentrasi<br>Kons: '+ob+'mg='+ (ob*1000) +'mcg / '+volNum+'mL = <b>'+ug.toFixed(1)+' mcg/mL</b></div>';
var d=document.createElement('div');d.className='lb';
if(jenis==='titrasi'){
 d.innerHTML='<div style="background:#d32f2f;color:#fff;text-align:center;font-weight:900;padding:5px;border-radius:6px">⚠️ HIGH ALERT - CIPUTRA HOSPITAL SURABAYA</div><div style="display:flex;justify-content:space-between;font-weight:800;margin-top:4px"><span>RM:'+rm+'</span><span>'+bb+'kg</span></div><b>'+nm+' | '+document.getElementById('rg').value+'</b><br><b>TOTAL: '+to+' dalam '+vo+'</b> + '+pe+'<br><div style="background:#fff176;padding:3px;text-align:center;border-radius:4px;margin:3px 0">🎯 TARGET: <b>'+ta+' = '+mlTarget+' mL/jam</b></div>'+tabel+rumus+'<hr style="margin:6px 0"><div style="font-size:9px">⏰ Buat:'+tgl+' | Exp:'+tglExp+'<br>👩‍⚕️ Giver:'+gv+' | 👀 Checker:'+ck+'<br>📦 Oplosan: '+to+' + '+pe+' ad '+vo+'</div><div style="border:2px solid #d32f2f;color:#d32f2f;text-align:center;border-radius:6px;font-weight:900;margin-top:5px;padding:3px">✅ DOUBLE CHECK OK</div>';
}else{
 d.innerHTML='<div style="background:#d32f2f;color:#fff;text-align:center;font-weight:900;padding:5px;border-radius:6px">⚠️ HIGH ALERT - SPOIT</div>RM:'+rm+' - '+nm+'<br><b>'+to+' dalam '+vo+'</b> + '+pe+'<br>🎯 '+ta+' mcg/kg/min = <b>'+mlTarget+' mL/jam</b><br>⏰ '+tgl+' | Exp:'+tglExp+'<br>'+gv+' | '+ck;
}
document.getElementById('area').appendChild(d);d.scrollIntoView({behavior:'smooth'});
}
</script></body></html>
